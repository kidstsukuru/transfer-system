<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>振替申請 - ツクル</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #fdfdfd; padding: 15px; margin: 0; color: #333; }
        .card { background: white; padding: 25px; border-radius: 16px; border-top: 10px solid #FFD700; box-shadow: 0 4px 15px rgba(0,0,0,0.08); max-width: 450px; margin: 0 auto; }
        .logo { text-align: center; font-weight: bold; color: #FFD700; font-size: 2em; margin-bottom: 10px; }
        .info { background: #fff9e6; padding: 12px; border-radius: 8px; font-size: 0.85em; margin-bottom: 15px; border: 1px solid #FFD700; line-height: 1.5; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 0.9em; }
        .sub-label { font-size: 0.75em; color: #888; font-weight: normal; margin-left: 5px; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; background: #fafafa; }
        input:disabled { background-color: #eee; cursor: not-allowed; }
        .radio-group { display: flex; gap: 10px; margin-top: 10px; }
        .radio-group label { flex: 1; text-align: center; background: #f0f0f0; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: normal; margin: 0; }
        .radio-group input { display: none; }
        .radio-group input:checked + label { background: #FFD700; font-weight: bold; }
        button { width: 100%; padding: 16px; background-color: #FFD700; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; margin-top: 25px; box-shadow: 0 4px 0 #e6c200; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">ツクル</div>
        <div class="info">
            ● 振替は<b>欠席した月の翌月</b>の日程からお選びください。<br>
            ● 翌月の通常授業に時間を追加（＋30分）して受講いただけます。
        </div>
        
        <label>生徒のお名前</label>
        <input type="text" id="name" placeholder="例：ツクル 太郎">

        <label>欠席日</label>
        <input type="date" id="date_off" onchange="updateConstraints()">

        <label>具体的な理由</label>
        <textarea id="detail" rows="2" placeholder="体調不良のため、等"></textarea>

        <label>振替を希望しますか？</label>
        <div class="radio-group">
            <input type="radio" name="need" id="y" value="はい" checked onclick="ui()"><label for="y">はい</label>
            <input type="radio" name="need" id="n" value="いいえ" onclick="ui()"><label for="n">いいえ</label>
        </div>

        <div id="t_area">
            <label>振替の形式</label>
            <div class="radio-group">
                <input type="radio" name="type" id="t90" value="90min" checked onclick="ui()"><label for="t90">90分×1回</label>
                <input type="radio" name="type" id="t30" value="30min" onclick="ui()"><label for="t30">30分ずつ追加</label>
            </div>
            
            <div id="date_inputs">
                <label>振替希望日1 <span class="sub-label">（必須）</span></label>
                <input type="date" id="d1" class="t-date" disabled>
                
                <div id="extra" class="hidden">
                    <label>振替希望日2 <span class="sub-label">（任意）</span></label>
                    <input type="date" id="d2" class="t-date" disabled>
                    <label>振替希望日3 <span class="sub-label">（任意）</span></label>
                    <input type="date" id="d3" class="t-date" disabled>
                </div>
            </div>
        </div>

        <button onclick="send()">申請を送信する</button>
        <div id="loading" class="hidden" style="text-align:center; margin-top:10px;">送信中...</div>
    </div>

    <script>
        const LIFF_ID = "あなたのLIFF ID"; 
        const GAS_URL = "あなたのGASウェブアプリURL"; 

        liff.init({ liffId: LIFF_ID }).then(() => {
            if (!liff.isLoggedIn()) liff.login();
        });

        // 欠席日に合わせて振替日のカレンダー範囲を翌月に固定
        function updateConstraints() {
            const dVal = document.getElementById('date_off').value;
            if (!dVal) return;

            const d = new Date(dVal);
            // 翌月の1日
            const first = new Date(d.getFullYear(), d.getMonth() + 1, 1).toISOString().split('T')[0];
            // 翌月の末日
            const last = new Date(d.getFullYear(), d.getMonth() + 2, 0).toISOString().split('T')[0];

            document.querySelectorAll('.t-date').forEach(el => {
                el.min = first;
                el.max = last;
                el.disabled = false; // 欠席日が選ばれたら有効化
                el.value = ""; // 欠席日が変わったらリセット
            });
            document.getElementById('d1').value = first; // 1日目は初期値をセット
        }

        function ui() {
            const need = document.querySelector('input[name="need"]:checked').value;
            const type = document.querySelector('input[name="type"]:checked').value;
            document.getElementById('t_area').className = (need === "いいえ") ? "hidden" : "";
            document.getElementById('extra').className = (type === "30min") ? "" : "hidden";
        }

        async function send() {
            const name = document.getElementById('name').value;
            const d_off = document.getElementById('date_off').value;
            const d1 = document.getElementById('d1').value;
            const need = document.querySelector('input[name="need"]:checked').value;

            if (!name || !d_off) return alert("名前と欠席日を入力してください");
            if (need === "はい" && !d1) return alert("振替希望日を入力してください");

            document.getElementById('loading').className = "";
            
            const profile = await liff.getProfile();
            const data = {
                userId: profile.userId, name, date_off: d_off, reason: "自己都合",
                reason_detail: document.getElementById('detail').value,
                needs_transfer: need,
                transfer_type: (need === "はい") ? document.querySelector('input[name="type"]:checked').value : "",
                date_on_1: (need === "はい") ? d1 : "",
                date_on_2: document.getElementById('d2').value,
                date_on_3: document.getElementById('d3').value
            };

            fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(data) })
            .then(() => { alert("申請が完了しました。"); liff.closeWindow(); });
        }
    </script>
</body>
</html>
