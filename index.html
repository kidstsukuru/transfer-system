<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>振替申請 | ツクル</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        /* --- 1. 変数設計（役割に応じた色） --- */
        :root {
            --brand-yellow: #FFD700;   /* ブランド色：ツクル */
            --action-black: #333333;   /* 操作色：文字・メインボタン */
            --error-red: #D93025;      /* 注意色：エラー・制約事項 */
            --bg-gray: #F8F9FA;        /* 背景色：ノイズを減らす */
            --card-white: #FFFFFF;     /* 土台色 */
            --border-soft: #E0E0E0;    /* 補助色：境界線 */
        }

        body { font-family: -apple-system, sans-serif; background-color: var(--bg-gray); margin: 0; color: var(--action-black); line-height: 1.6; }
        .container { max-width: 480px; margin: 0 auto; padding: 20px; box-sizing: border-box; }

        /* --- 2. 情報の優先順位（視覚的ヒエラルキー） --- */
        header { text-align: left; margin-bottom: 24px; border-left: 6px solid var(--brand-yellow); padding-left: 12px; }
        header h1 { font-size: 20px; margin: 0; font-weight: 800; }
        header p { font-size: 13px; color: #666; margin: 4px 0 0; }

        section { background: var(--card-white); border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .section-title { font-size: 14px; font-weight: bold; margin-bottom: 16px; color: #666; display: flex; align-items: center; }
        .section-title::after { content: ""; flex: 1; height: 1px; background: var(--border-soft); margin-left: 12px; }

        /* --- 3. 入力フィールド（実運用での破綻防止） --- */
        .field { margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 8px; }
        input[type="text"], input[type="date"], textarea, select {
            width: 100%; padding: 14px; border: 1.5px solid var(--border-soft); border-radius: 8px; font-size: 16px; box-sizing: border-box; background: #fff; appearance: none;
        }
        input:focus, textarea:focus { border-color: var(--brand-yellow); outline: none; background: #fffdf0; }
        
        /* 注意が必要な制約事項 */
        .constraint { color: var(--error-red); font-size: 12px; font-weight: bold; margin-top: 6px; display: flex; align-items: flex-start; }
        .constraint::before { content: "⚠️"; margin-right: 4px; }

        /* --- 4. 意思決定ボタン（状態を色で表現） --- */
        .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .option-card { position: relative; }
        .option-card input { display: none; }
        .option-card label {
            display: block; padding: 16px; text-align: center; border: 1.5px solid var(--border-soft); border-radius: 10px; cursor: pointer; font-size: 15px; background: #fff; transition: all 0.2s;
        }
        .option-card input:checked + label {
            background-color: var(--brand-yellow); border-color: var(--brand-yellow); font-weight: bold; box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
        }

        /* --- 5. プログレッシブ・ディスクロージャー（最初は隠す） --- */
        #transfer_flow { display: none; margin-top: 16px; border-top: 2px solid var(--brand-yellow); padding-top: 24px; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .submit-btn {
            width: 100%; padding: 18px; background: var(--action-black); color: #fff; border: none; border-radius: 12px; font-size: 17px; font-weight: bold; margin-top: 32px; box-shadow: 0 4px 14px rgba(0,0,0,0.2); transition: 0.2s;
        }
        .submit-btn:active { transform: scale(0.98); }
        .submit-btn:disabled { background: #ccc; box-shadow: none; }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>振替申請</h1>
            <p>Programming School ツクル</p>
        </header>

        <section>
            <div class="section-title">欠席の状況</div>
            <div class="field">
                <label>生徒のお名前</label>
                <input type="text" id="name" placeholder="フルネームを入力">
            </div>
            <div class="field">
                <label>お休みする日</label>
                <input type="date" id="date_off" onchange="initTransferConstraints()">
            </div>
            <div class="field">
                <label>具体的な理由（任意）</label>
                <textarea id="detail" rows="2" placeholder="体調不良のため、等"></textarea>
            </div>
        </section>

        <section>
            <div class="section-title">振替の希望</div>
            <label>振替授業を希望されますか？</label>
            <div class="option-grid">
                <div class="option-card">
                    <input type="radio" name="need" id="n" value="いいえ" checked onclick="toggleFlow()">
                    <label for="n">希望しない</label>
                </div>
                <div class="option-card">
                    <input type="radio" name="need" id="y" value="はい" onclick="toggleFlow()">
                    <label for="y">希望する</label>
                </div>
            </div>
        </section>

        <div id="transfer_flow">
            <section>
                <div class="section-title">振替の日程調整</div>
                
                <div class="field">
                    <label>受講形式</label>
                    <div class="option-grid">
                        <div class="option-card">
                            <input type="radio" name="type" id="t90" value="90min" checked onclick="toggleFlow()">
                            <label for="t90">90分 × 1回</label>
                        </div>
                        <div class="option-card">
                            <input type="radio" name="type" id="t30" value="30min" onclick="toggleFlow()">
                            <label for="t30">30分ずつ追加</label>
                        </div>
                    </div>
                </div>

                <div class="field">
                    <label id="date_label_1">振替希望日 1</label>
                    <input type="date" id="d1" class="t-date" disabled>
                    <div class="constraint">欠席日の翌月のみ選択可能です。</div>
                </div>

                <div id="split_dates" class="hidden">
                    <div class="field">
                        <label>振替希望日 2（任意）</label>
                        <input type="date" id="d2" class="t-date" disabled>
                    </div>
                    <div class="field">
                        <label>振替希望日 3（任意）</label>
                        <input type="date" id="d3" class="t-date" disabled>
                    </div>
                </div>
            </section>
        </div>

        <button class="submit-btn" id="submit_trigger" onclick="handleSend()">申請内容を送信する</button>
        <p style="text-align:center; font-size:12px; color:#999; margin-top:16px;">※送信後、LINEに確認メッセージが届きます。</p>
    </div>

    <script>
        const LIFF_ID = "2009156481-8H1NbFct"; 
        const GAS_URL = "https://script.google.com/macros/s/AKfycbz6iIRZyMKnwdmjUc4jC3Q1vHS17BICVFng5uxGGfqSohzY-r_7UDvKQwp5_nQbWrkR/exec"; 

        liff.init({ liffId: LIFF_ID }).then(() => {
            if (!liff.isLoggedIn()) liff.login();
        });

        // 日付の制約（翌月のみ）をセット
        function initTransferConstraints() {
            const offVal = document.getElementById('date_off').value;
            if (!offVal) return;

            const d = new Date(offVal);
            const first = new Date(d.getFullYear(), d.getMonth() + 1, 1).toISOString().split('T')[0];
            const last = new Date(d.getFullYear(), d.getMonth() + 2, 0).toISOString().split('T')[0];

            document.querySelectorAll('.t-date').forEach(el => {
                el.min = first;
                el.max = last;
                el.disabled = false;
                el.value = "";
            });
            document.getElementById('d1').value = first;
        }

        // 表示の切り替え
        function toggleFlow() {
            const need = document.querySelector('input[name="need"]:checked').value;
            const type = document.querySelector('input[name="type"]:checked').value;
            const flow = document.getElementById('transfer_flow');
            const split = document.getElementById('split_dates');

            if (need === "はい") {
                flow.style.display = "block";
                split.style.display = (type === "30min") ? "block" : "none";
                document.getElementById('date_label_1').innerText = (type === "30min") ? "振替希望日 1" : "振替希望日";
                // 自然な視線誘導のためのスクロール
                setTimeout(() => flow.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
            } else {
                flow.style.display = "none";
            }
        }

        async function handleSend() {
            const name = document.getElementById('name').value;
            const d_off = document.getElementById('date_off').value;
            const need = document.querySelector('input[name="need"]:checked').value;
            const btn = document.getElementById('submit_trigger');

            if (!name || !d_off) return alert("お名前と欠席日を入力してください。");
            
            btn.disabled = true;
            btn.innerText = "送信中...";

            const profile = await liff.getProfile();
            const data = {
                userId: profile.userId,
                name: name,
                date_off: d_off,
                reason: "自己都合",
                reason_detail: document.getElementById('detail').value,
                needs_transfer: need,
                transfer_type: (need === "はい") ? document.querySelector('input[name="type"]:checked').value : "",
                date_on_1: (need === "はい") ? document.getElementById('d1').value : "",
                date_on_2: document.getElementById('d2').value,
                date_on_3: document.getElementById('d3').value
            };

            fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(data) })
            .then(() => {
                alert("送信が完了しました。LINEをご確認ください。");
                liff.closeWindow();
            }).catch(e => {
                alert("エラーが発生しました。");
                btn.disabled = false;
                btn.innerText = "申請内容を送信する";
            });
        }
    </script>
</body>
</html>
